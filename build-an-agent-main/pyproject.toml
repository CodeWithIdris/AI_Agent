[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AI_Agent"
version = "0.2.0"
description = "A production-grade, modular, tool-enabled autonomous AI Agent system with CLI & Web UI."
readme = "README.md"
authors = [
    { name = "CodeWithIdris", email = "codewithidris@github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=1.11.0",
    "openai>=2.32.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]


[project.urls]
Homepage = "https://github.com/CodeWithIdris/AI_Agent"
Repository = "https://github.com/CodeWithIdris/AI_Agent"
Author = "https://github.com/CodeWithIdris"

[project.scripts]
ai-agent = "ai_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

